<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Survivor - No Toques El Rojo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --danger: #ef4444;
            --coin: #fbbf24;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        @media (min-width: 480px) {
            .container {
                border-radius: 24px;
                height: 85vh;
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            background-color: var(--card-bg);
            z-index: 10;
            transition: opacity 0.2s;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-play {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            width: 100%;
            max-width: 260px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s;
        }

        .btn-play:active {
            transform: scale(0.95);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border);
            background: rgba(17, 24, 39, 0.9);
            z-index: 5;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #gameCanvas {
            flex: 1;
            width: 100%;
            background-color: var(--bg-color);
            cursor: crosshair;
            display: block;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            width: 100%;
            max-width: 260px;
        }

        .score-val {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--coin);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Inicio -->
        <div id="startScreen" class="screen">
            <h1>NO TOQUES<br><span style="color: var(--danger); text-shadow: 0 0 20px rgba(239, 68, 68, 0.4);">EL ROJO</span></h1>
            <p class="subtitle">Esquiva los obstáculos rojos neón, atrapa las monedas y siente el ritmo futurista.</p>
            <div style="font-size: 3.5rem; margin-bottom: 20px;">🛡️🎶</div>
            <button class="btn-play" onclick="startGame()">▶ JUGAR AHORA</button>
        </div>

        <!-- Pantalla de Juego Activo -->
        <div class="game-header">
            <div class="hud-item">🏆 <span id="currentScore">0</span></div>
            <div class="hud-item">🪙 <span id="currentCoins">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>

        <!-- Pantalla Game Over -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: var(--danger); text-shadow: 0 0 20px rgba(239, 68, 68, 0.4);">¡TE ATRAPARON!</h1>
            <p class="subtitle">La música futurista se detuvo. ¿Querés revivir la aventura?</p>
            
            <div class="score-box">
                <div style="color: var(--text-muted); font-size: 0.85rem; font-weight: 700;">PUNTUACIÓN FINAL</div>
                <div class="score-val" id="finalScore">0</div>
            </div>

            <button class="btn-play" onclick="startGame()">🔄 JUGAR OTRA VEZ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const currentScoreEl = document.getElementById('currentScore');
        const currentCoinsEl = document.getElementById('currentCoins');
        const finalScoreEl = document.getElementById('finalScore');

        let isPlaying = false;
        let score = 0;
        let coins = 0;
        let gameInterval;
        let spawnTimer = 0;

        // Web Audio API para música y efectos sintetizados
        let audioCtx = null;
        let musicTimer = null;
        let bassStep = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Reproducir música futurista de fondo (Arpegio electrónico continuo)
        function startFuturisticMusic() {
            if (musicTimer) clearInterval(musicTimer);
            const notes = [110, 130.81, 146.83, 164.81, 196, 220]; // Escala menor electrónica
            
            musicTimer = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sawtooth'; // Sonido sintetizador retro-futurista
                let freq = notes[bassStep % notes.length];
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // Filtro para suavizar el sonido futurista
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400 + (score % 500), audioCtx.currentTime);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);

                bassStep++;
            }, 150); // Ritmo rápido y constante
        }

        function stopFuturisticMusic() {
            if (musicTimer) clearInterval(musicTimer);
        }

        // Efecto de sonido al recolectar monedas
        function playCoinSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // Sube a A5
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.16);
        }

        // Efecto de sonido dramático al morir / chocar
        function playDeathSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5); // Descenso brusco
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.55);
        }

        let player = { x: 0, y: 0, radius: 14, color: '#38bdf8' };
        let touchX = 0, touchY = 0;
        let obstacles = [];
        let collectibleCoins = [];

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
            touchY = e.clientY - rect.top;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            touchX = e.touches[0].clientX - rect.left;
            touchY = e.touches[0].clientY - rect.top;
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            touchX = e.touches[0].clientX - rect.left;
            touchY = e.touches[0].clientY - rect.top;
            if (!isPlaying) startGame();
        });

        function startGame() {
            initAudio();
            startFuturisticMusic();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            score = 0;
            coins = 0;
            obstacles = [];
            collectibleCoins = [];
            spawnTimer = 0;
            isPlaying = true;

            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            touchX = player.x;
            touchY = player.y;

            cancelAnimationFrame(gameInterval);
            loop();
        }

        function spawnObstacle() {
            let radius = Math.random() * 16 + 12;
            let edge = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            let speed = 2 + Math.min(score / 500, 5);

            if (edge === 0) { x = Math.random() * canvas.width; y = -radius; vx = (Math.random() - 0.5) * speed; vy = Math.random() * speed + 1; }
            else if (edge === 1) { x = Math.random() * canvas.width; y = canvas.height + radius; vx = (Math.random() - 0.5) * speed; vy = -(Math.random() * speed + 1); }
            else if (edge === 2) { x = -radius; y = Math.random() * canvas.height; vx = Math.random() * speed + 1; vy = (Math.random() - 0.5) * speed; }
            else { x = canvas.width + radius; y = Math.random() * canvas.height; vx = -(Math.random() * speed + 1); vy = (Math.random() - 0.5) * speed; }

            obstacles.push({ x, y, radius, vx, vy });
        }

        function spawnCoin() {
            collectibleCoins.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                radius: 10
            });
        }

        function loop() {
            if (!isPlaying) return;

            player.x += (touchX - player.x) * 0.2;
            player.y += (touchY - player.y) * 0.2;

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            score += 1;
            currentScoreEl.textContent = Math.floor(score / 10);
            currentCoinsEl.textContent = coins;

            spawnTimer++;
            if (spawnTimer % Math.max(20, 60 - Math.floor(score / 200)) === 0) spawnObstacle();
            if (spawnTimer % 250 === 0) spawnCoin();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x += obs.vx;
                obs.y += obs.vy;

                let distX = player.x - obs.x;
                let distY = player.y - obs.y;
                let distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < player.radius + obs.radius) {
                    if (navigator.vibrate) navigator.vibrate(250);
                    playDeathSound();
                    endGame();
                    return;
                }

                if (obs.x < -50 || obs.x > canvas.width + 50 || obs.y < -50 || obs.y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = collectibleCoins.length - 1; i >= 0; i--) {
                let coin = collectibleCoins[i];
                let distX = player.x - coin.x;
                let distY = player.y - coin.y;
                let distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < player.radius + coin.radius) {
                    coins += 1;
                    score += 150;
                    if (navigator.vibrate) navigator.vibrate(60);
                    playCoinSound();
                    collectibleCoins.splice(i, 1);
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Monedas
            ctx.fillStyle = '#fbbf24';
            collectibleCoins.forEach(coin => {
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Obstáculos
            ctx.fillStyle = '#ef4444';
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Jugador
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.shadowBlur = 0;

            gameInterval = requestAnimationFrame(loop);
        }

        function endGame() {
            isPlaying = false;
            stopFuturisticMusic();
            cancelAnimationFrame(gameInterval);
            finalScoreEl.textContent = Math.floor(score / 10);
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
